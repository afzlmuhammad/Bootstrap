<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>courseprogress</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
</head>
<body>
    <div class="container-fluid">

    <ul class = "breadcrumb">
      <li class = "breadcrumb-item"><a href = "https://www.mashupstack.com">Home</a></li>
      <li class = "breadcrumb-item"><a href="https://www.mashupstack.com/list-courses">Courses</a></li>
    <li class = "breadcrumb-item active" aria-current = "page">Web Development</li>
    </ul>
   
    <h1>Web Development Course <span class = "badge badge-primary">New</span></h1><br>
   
    <div class="progress">
      <div class="progress-bar bg-success progress-bar-striped" style="width:100%">HTML</div>
    </div><br>
   <div class="progress">
      <div class="progress-bar progress-bar-striped progress-bar-animated" style="width:75%">CSS</div>
    </div><br>
    <div class="progress">
      <div class="progress-bar bg-warning" style="width:50%">JavaScript</div>
    </div><br>
    <div class="progress">
      <div class="progress-bar bg-danger" style="width:25%">Bootstrap</div>
    </div><br><br>

    <div>
      <button type = "button" class = "btn btn-primary">Start</button>
      <button type = "button" class = "btn btn-danger">Pause</button>
      <button type = "button" class = "btn btn-secondary">Reset</button>
    </div><br><br>

    <nav class="fixed-bottom bg-white py-3" aria-label="Page navigation">
    <ul class="pagination justify-content-center m-0">
      <li class="page-item"><a class="page-link" href="#">Previous</a></li>
      <li class="page-item active"><a class="page-link" href="#">1</a></li>
      <li class="page-item"><a class="page-link" href="#">2</a></li>
      <li class="page-item disabled"><a class="page-link" href="#">3</a></li>
      <li class="page-item"><a class="page-link" href="#">Next</a></li>
    </ul>

    </div>
</body>
</html>
