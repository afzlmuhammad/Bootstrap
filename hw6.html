<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bakery</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
</head>
<body>
    <div class="container-fluid mt-3 mb-3">

    <form>
    <div class="row">
    <div class="col">
      <label for="firstname">Name:</label> 
      <input class="form-control" id="firstname"  placeholder="Enter name" name="fname">
    </div>
    </div>

    <div class="form-group">
      <label for="email">Email:</label>
      <input type="email" class="form-control" id="email" placeholder="Enter email" name="email">
    </div>

    <div class="form-group">
      <label for="comment">Feedback:</label>
      <textarea class="form-control" rows="3" id="comment" placeholder="Give your feedback"></textarea>
    </div>
    
    <label for="email phone">Preferred contact method:</label>
    <div class="form-group">
      <label for="email">Email:</label>
      <input type="email" class="form-control" id="email" placeholder="Enter email" name="email">
    </div>
    <div class="mb-3">
    <label for="phone" class="form-label">Phone Number</label>
    <input
      type="tel" 
      class="form-control" 
      id="phone" 
      name="phone"
      maxlength="10" 
      pattern="[0-9]{10}"
      inputmode="numeric"
      placeholder="Enter 10-digit phone number"
      oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 10)"
      required>
    <div class="invalid-feedback">
    Please enter a valid 10-digit phone number.
    </div>
    </div>
    <br>

    

    <label for="radio">How satisfied are you with this website:</label><br>
    <div class="form-check-inline" for="radio">
      <label class="form-check-label">
      <input type="radio" class="form-check-input "name="optradio">1
    </label>
    </div>
    <div class="form-check-inline">
      <label class="form-check-label">
      <input type="radio" class="form-check-input"name="optradio" >2
    </label>
    </div>
    <div class="form-check-inline disabled">
      <label class="form-check-label">
      <input type="radio" class="form-check-input" name="optradio" >3
    </label>
    </div>
    <div class="form-check-inline disabled">
      <label class="form-check-label">
      <input type="radio" class="form-check-input" name="optradio" >4
    </label>
    </div>
    <div class="form-check-inline disabled">
      <label class="form-check-label">
      <input type="radio" class="form-check-input" name="optradio" >5
    </label>
    </div>
    <div class="form-check-inline">
      <label class="form-check-label">
      <input type="radio" class="form-check-input"name="optradio" >6
    </label>
    </div>
    <div class="form-check-inline">
      <label class="form-check-label">
      <input type="radio" class="form-check-input"name="optradio" >7
    </label>
    </div>
    <div class="form-check-inline">
      <label class="form-check-label">
      <input type="radio" class="form-check-input"name="optradio" >8
    </label>
    </div>
    <div class="form-check-inline">
      <label class="form-check-label">
      <input type="radio" class="form-check-input"name="optradio" >9
    </label>
    </div>
    <div class="form-check-inline">
      <label class="form-check-label">
      <input type="radio" class="form-check-input"name="optradio" >10
    </label>
    </div>
    <br><br>

    <div class ="dropdown">
      <button type="button" class="btn btn-dark dropdown-toggle" data-toggle="dropdown">Type of order:</button>
      <div class="dropdown-menu">
      <a class="dropdown-item" href="#">Cakes</a>
      <a class="dropdown-item" href="#">Cookies</a>
      <a class="dropdown-item" href="#">Pastries</a>
    </div>
    </div><br><br><br><br><br>

    <button type="submit" class="btn btn-primary">Submit</button>
    </form>

    </div>
</body>
</html>
